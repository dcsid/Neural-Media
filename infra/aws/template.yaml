AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Neural Media — single-video control plane.
  API Gateway HTTP API + DynamoDB + S3 + 5 Lambdas + $5 billing alarm.
  Sized to stay inside the AWS free tier; expected cost at ~1k jobs/month
  is $0. See infra/aws/README.md for deploy instructions.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z0-9]{1,16}$"
    Description: Short stage slug (e.g., dev, prod). Used in resource names.

  HFSpaceUrl:
    Type: String
    Description: >
      Base URL of the Hugging Face Space, no trailing slash. The worker
      Lambda POSTs `<this-value>/predict` with the job payload.
    AllowedPattern: "^https?://.+$"

  FrontendOrigin:
    Type: String
    Default: http://localhost:3000
    Description: >
      Production frontend origin allowed by CORS. localhost:3000 is always
      allowed in addition.

  HFCallbackSecretSsmName:
    Type: String
    Default: /neural-media/hf-callback-secret
    Description: >
      Name of the SSM SecureString parameter holding the shared callback
      secret. The HF callback and worker Lambdas fetch it at cold start
      via ssm:GetParameter (the resolve:ssm-secure dynamic reference is
      NOT supported in Lambda env vars; see lambdas/shared/__init__.py
      → get_callback_secret()). Create the parameter once out-of-band
      (see README).

  HFCallbackSecretSsmVersion:
    Type: String
    Default: ""
    Description: >
      Optional pinned version of the SSM SecureString (numeric, as a
      string). Empty means "latest" — the Lambda code passes
      Name:Version when this is set. Bump-and-redeploy to rotate
      without recreating the parameter.

  BillingAlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional email to subscribe to the $5/month billing alarm SNS topic.
      Leave blank to skip subscription — the alarm still fires, you just
      won't receive an email until you subscribe manually.

Conditions:
  HasBillingEmail: !Not [!Equals [!Ref BillingAlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 128
    Timeout: 30
    Architectures: [arm64]
    Environment:
      Variables:
        JOBS_TABLE: !Ref JobsTable
        RESULTS_BUCKET: !Ref ResultsBucket
        FRONTEND_ORIGIN: !Ref FrontendOrigin
        HF_SPACE_URL: !Ref HFSpaceUrl
        # The decrypted shared secret is NEVER put in a Lambda env var
        # — CFN's resolve:ssm-secure dynamic reference is not on the
        # whitelist for Lambda env vars (it would land as the literal
        # "{{resolve:...}}" string). Lambdas fetch it at cold start via
        # ssm:GetParameter; only the name (and optional pinned version)
        # is propagated as plain text. See
        # lambdas/shared/__init__.py → get_callback_secret().
        HF_CALLBACK_SECRET_SSM_NAME: !Ref HFCallbackSecretSsmName
        HF_CALLBACK_SECRET_SSM_VERSION: !Ref HFCallbackSecretSsmVersion
        STAGE: !Ref Stage

Resources:
  # ---------------------------------------------------------------------------
  # S3 — uploads/{jobId}.mp4 (browser presigned PUT)
  #      results/{jobId}.json.gz (written by hf_callback)
  # Block all public access, SSE on, CORS PUT/GET, lifecycle clean-up.
  # ---------------------------------------------------------------------------
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "neural-media-${Stage}-results-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins:
              - !Ref FrontendOrigin
              - "http://localhost:3000"
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter1Day
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
          - Id: ExpireResultsAfter30Days
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 30

  # ---------------------------------------------------------------------------
  # DynamoDB — one row per job. PAY_PER_REQUEST (no provisioned capacity),
  # TTL on `expiresAt` so old jobs evaporate for free.
  # ---------------------------------------------------------------------------
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "neural-media-${Stage}-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # ---------------------------------------------------------------------------
  # HTTP API v2 — cheaper + simpler than REST API. Native CORS support.
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - "http://localhost:3000"
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, x-nm-token]
        MaxAge: 3600

  # ---------------------------------------------------------------------------
  # Lambda × 5. All share `CodeUri: lambdas/` so `from shared import ...`
  # resolves cleanly inside each function. The unused-handler files in each
  # zip add ~10 KB — well below the 50 MB Lambda limit and not worth a
  # Layer-based split for a stack this small.
  # ---------------------------------------------------------------------------

  # Functions declared WITHOUT Events.HttpApi so they don't auto-create
  # Lambda::Permission resources whose API-gateway dependency closes a
  # JobsWorker → HttpApi cycle (JobsWorker reads the API URL via Sub).
  # Routing/integration/permission resources are declared standalone
  # below (see "API Gateway wiring"). This is the cleanest SAM +
  # HttpApi pattern for 2024+.

  JobsCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "neural-media-${Stage}-jobs-create"
      CodeUri: lambdas/
      Handler: jobs_create.handler.lambda_handler
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref JobsWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref JobsWorkerFunction

  JobsUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "neural-media-${Stage}-jobs-upload"
      CodeUri: lambdas/
      Handler: jobs_upload.handler.lambda_handler
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref JobsWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref JobsWorkerFunction
        - Statement:
            - Sid: PresignUploadsPrefix
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResultsBucket.Arn}/uploads/*"

  JobsWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "neural-media-${Stage}-jobs-worker"
      CodeUri: lambdas/
      Handler: jobs_worker.handler.lambda_handler
      # Long enough to cold-boot a sleeping HF Space (HF_WAKE_BUDGET_SEC=180s)
      # via /healthz polling, then POST /predict — with margin. Warm jobs return
      # in ~1s; only a cold gcTimeout wake blocks. Async-invoked, so the
      # occasional wait costs nothing meaningful.
      Timeout: 240
      Environment:
        Variables:
          # The HF Space POSTs results back here. Built at deploy time so
          # the worker doesn't need to discover its own API Gateway URL.
          # Safe to Sub now that HttpApi has no incoming function deps.
          CALLBACK_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/v2/internal/hf-callback"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Sid: ReadUploadsForPresigning
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ResultsBucket.Arn}/uploads/*"
        # Cold-start fetch of HF_CALLBACK_SECRET from SSM SecureString.
        # KMS:Decrypt is scoped by ViaService so we can only decrypt
        # CMKs that SSM is calling through, not arbitrary keys.
        - Statement:
            - Sid: ReadCallbackSecretFromSsm
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neural-media/*"
            - Sid: DecryptCallbackSecretViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      # No HttpApi event — invoked asynchronously via lambda:InvokeFunction
      # (InvocationType=Event) by jobs_create and jobs_upload.

  JobsStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "neural-media-${Stage}-jobs-status"
      CodeUri: lambdas/
      Handler: jobs_status.handler.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Sid: ReadResultsForPresigning
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ResultsBucket.Arn}/results/*"

  HfCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "neural-media-${Stage}-hf-callback"
      CodeUri: lambdas/
      Handler: hf_callback.handler.lambda_handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            - Sid: WriteResultsPrefix
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResultsBucket.Arn}/results/*"
        # Same SSM SecureString fetch as JobsWorker — see the comment
        # there for the KMS:Decrypt scope rationale.
        - Statement:
            - Sid: ReadCallbackSecretFromSsm
              Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/neural-media/*"
            - Sid: DecryptCallbackSecretViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ---------------------------------------------------------------------------
  # API Gateway wiring — standalone Integrations / Routes / Permissions.
  # Declared at the top level (not via SAM's Function.Events.HttpApi) so
  # no function depends on HttpApi via its Permission resource. JobsWorker
  # still depends on HttpApi (one-way) through its CALLBACK_URL env var;
  # without function-side Permissions, HttpApi does not depend back, so
  # the deploy-time cycle is broken.
  #
  # Each integration is AWS_PROXY (Lambda proxy) with payload format 2.0
  # — the format the existing handlers already parse via the shared
  # helpers (event["headers"] lowercase, event["body"] str/JSON).
  # ---------------------------------------------------------------------------

  JobsCreateIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JobsCreateFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  JobsCreatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobsCreateFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v2/jobs"

  JobsCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /v2/jobs"
      Target: !Sub "integrations/${JobsCreateIntegration}"

  JobsUploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JobsUploadFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  # Single permission covers both upload routes — wildcarded on path
  # under /v2/jobs/upload so we don't need one Permission per route.
  JobsUploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobsUploadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v2/jobs/upload*"

  JobsUploadCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /v2/jobs/upload"
      Target: !Sub "integrations/${JobsUploadIntegration}"

  JobsUploadConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /v2/jobs/upload/{jobId}/confirm"
      Target: !Sub "integrations/${JobsUploadIntegration}"

  JobsStatusIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JobsStatusFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  JobsStatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JobsStatusFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v2/jobs/*"

  JobsStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /v2/jobs/{jobId}"
      Target: !Sub "integrations/${JobsStatusIntegration}"

  HfCallbackIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HfCallbackFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  HfCallbackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HfCallbackFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v2/internal/hf-callback"

  HfCallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /v2/internal/hf-callback"
      Target: !Sub "integrations/${HfCallbackIntegration}"

  # ---------------------------------------------------------------------------
  # CloudWatch billing alarm — the non-negotiable safety net. Fires when
  # estimated monthly USD spend exceeds $5. Must be in us-east-1; billing
  # metrics are only published there regardless of stack region.
  # ---------------------------------------------------------------------------
  BillingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "neural-media-${Stage}-billing-alarm"
      DisplayName: Neural Media billing alarm

  BillingAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasBillingEmail
    Properties:
      Protocol: email
      Endpoint: !Ref BillingAlarmEmail
      TopicArn: !Ref BillingAlarmTopic

  BillingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "neural-media-${Stage}-billing-over-5-usd"
      AlarmDescription: Estimated monthly AWS spend exceeded $5 USD.
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600 # 6 hours — billing metric only updates a few times/day
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref BillingAlarmTopic

Outputs:
  ApiEndpoint:
    Description: HTTP API base URL. Frontend POSTs /v2/jobs here.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  HfCallbackUrl:
    Description: Full URL the HF Space POSTs to with completed inference.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/v2/internal/hf-callback"
    Export:
      Name: !Sub "${AWS::StackName}-HfCallbackUrl"

  ResultsBucketName:
    Description: S3 bucket holding uploads/ + results/.
    Value: !Ref ResultsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ResultsBucket"

  JobsTableName:
    Description: DynamoDB table name (matches the JOBS_TABLE env var).
    Value: !Ref JobsTable
    Export:
      Name: !Sub "${AWS::StackName}-JobsTable"

  BillingAlarmTopicArn:
    Description: SNS topic ARN for the $5 billing alarm. Subscribe manually
                 if you didn't supply BillingAlarmEmail at deploy time.
    Value: !Ref BillingAlarmTopic
    Export:
      Name: !Sub "${AWS::StackName}-BillingAlarmTopic"
