[project]
name = "neural-media-pipeline"
version = "0.0.1"
description = "Clip-fetcher for Neural Media: download a video (yt-dlp) and normalize it to TRIBE v2's input shape (ffmpeg). Local-first; nothing leaves the machine."
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
  "pydantic>=2.6",
  # Preprocessing pulls DEFAULT_PREPROCESSING_PARAMS from the inference
  # package so the clip-fetcher can never drift from the values TRIBE v2
  # expects on its input.
  "neural-media-inference",
]

[tool.uv.sources]
neural-media-inference = { path = "../inference", editable = true }

[project.optional-dependencies]
# Real network/media tooling. Tests monkeypatch the network seam, so
# yt-dlp is not required to run the test suite — install it only when
# you actually need to pull videos. ffmpeg comes from the system (brew
# install ffmpeg); we shell out to it rather than wrapping a binding.
download = [
  "yt-dlp>=2024.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_media_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
