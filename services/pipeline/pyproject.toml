[project]
name = "neural-media-pipeline"
version = "0.0.1"
description = "TikTok export → normalized videos + watch events for Neural Media. Local-first; nothing leaves the machine."
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Real network/media tooling. Tests monkeypatch the network seam, so
# yt-dlp is not required to run the test suite — install it only when
# you actually need to pull videos. ffmpeg comes from the system (brew
# install ffmpeg); we shell out to it rather than wrapping a binding.
download = [
  "yt-dlp>=2024.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_media_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
