[project]
name = "neural-media-inference"
version = "0.0.1"
description = "TRIBE v2 inference wrapper for Neural Media. Ships with a deterministic mock backend; real TRIBE backend is opt-in."
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
real = [
  # Tribev2 upstream pins torch >=2.5.1,<2.7 (see its pyproject.toml).
  # Match that window so resolution is stable; without our pin pip may pick
  # a torch that conflicts with tribev2's transitive constraints.
  "torch>=2.5.1,<2.7",
  # We import `huggingface_hub.HfApi` directly in backend_tribe.py to resolve
  # the commit sha for the reproducibility envelope. Tribev2 also depends on
  # huggingface_hub (unpinned upstream) — both resolve to the same install.
  "huggingface-hub>=0.24",
  # TRIBE v2 isn't on PyPI — pull directly from facebookresearch.
  # CC-BY-NC-4.0. Transitively brings: transformers, numpy==2.2.6, moviepy,
  # x_transformers, spacy, soundfile, julius, plus Meta's first-party
  # `neuralset` / `neuraltrain`. Model weights (LLaMA-3.2-3B, V-JEPA2-vitg,
  # Wav2Vec-BERT 2.0) are fetched at first use via huggingface_hub — run
  # `python -m neural_media_inference.scripts.validate_real_mode` (or
  # `services/inference/scripts/validate_real_mode.py`) to confirm gates.
  "tribev2 @ git+https://github.com/facebookresearch/tribev2",
]
atlas-build = [
  # Build-time only — used by scripts/build_region_masks.py to (re)generate
  # data/region_masks.json. End users never need these; the committed JSON
  # is the contract.
  "mne>=1.6",
  "nibabel>=5.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
  "integration: real-mode tests that need the [real] extra (torch + tribev2) and a fixture video, typically on a GPU host. Skipped by default; run on demand with `pytest -m integration`.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_media_inference*"]

[tool.setuptools.package-data]
neural_media_inference = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
