[project]
name = "neural-media-inference"
version = "0.0.1"
description = "TRIBE v2 inference wrapper for Neural Media. Ships with a deterministic mock backend; real TRIBE backend is opt-in."
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
real = [
  "torch>=2.3",
  "transformers>=4.42",
  "pyarrow>=15",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_media_inference*"]

[tool.ruff]
line-length = 100
target-version = "py311"
