# HuggingFace Space config for the neural-media TRIBE inference Space.
#
# HF Spaces actually reads its config from the YAML frontmatter of
# README.md (the file `README.md` at the Space repo root).  We mirror
# the same values here as the canonical record of what the Space wants
# from HF, and the deploy script (see README §Deploy) syncs them into
# the README frontmatter before pushing.

sdk: docker
# Dedicated A10G that sleeps when idle (NOT ZeroGPU). Must match the README.md
# frontmatter `hardware:` value — HF reads the README, this file is the mirror.
# A dedicated Space is required: the TRIBE phase runs for minutes, which exceeds
# any per-call ZeroGPU budget, and it needs the persistent /data weight cache.
hardware: a10g-small
suggested_storage: small # we cache HF weights + uv env under /data
app_port: 7860           # uvicorn listens here; HF maps the public port
short_description: TRIBE v2 inference for single-video brain-prediction requests
license: cc-by-nc-4.0    # matches services/inference and TRIBE upstream
pinned: false
secrets:
  - CALLBACK_SHARED_SECRET   # must match the AWS Lambda's NM_CALLBACK_TOKEN
