[project]
name = "neural-media-api"
version = "0.0.1"
description = "FastAPI orchestrator for Neural Media. Local-first, single-user."
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.6",
  "numpy>=1.26",
  "neural-media-inference",
  "neural-media-pipeline",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.uv.sources]
neural-media-inference = { path = "../inference", editable = true }
neural-media-pipeline = { path = "../pipeline", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_media_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"
